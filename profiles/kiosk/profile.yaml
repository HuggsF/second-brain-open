name: kiosk
labels:
  type: [adr, system, architecture, product, reference, team, domain, daily, rule, playbook, demand]
  team: [logistics, erp-integrations, crm-salesforce, platform, ecommerce]
local_model: llama3.2:3b        # opcional; padrão do núcleo
timeout_seconds: 120
max_input_tokens: 6000
retries: 1
paid_reference:                 # preço usado para estimar a economia (USD por 1M tokens)
  model: reference-small
  input: 0.15
  output: 0.60
providers:
  - kind: openai_compatible
    name: openrouter
    model: deepseek/deepseek-v4-flash-0731   # vencedor do task-eval de 2026-10-13
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 20
    structured: json_schema
    extra:
      provider:
        data_collection: deny
        zdr: true
    price:                            # lista pública do provedor, USD por 1M tokens
      input: 0.016
      output: 0.64
  - kind: ollama
    model: llama3.2:3b
    timeout_seconds: 120
    keep_alive: 30m
