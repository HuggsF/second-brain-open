# Negativos: perguntas sem resposta no vault. `absent_entities` lista os nomes que não podem aparecer
# em vault/ (tests/test_golden_dataset.py confere); `neighbor_domain` marca sistemas plausíveis para a
# operação da holding que o vault não documenta.
