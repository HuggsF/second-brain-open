  - {prompt: "Quem ganhou a Copa do Mundo de 2022 e qual foi o placar da final?", absent_entities: [], neighbor_domain: false}
  - {prompt: "Quantas luas tem Júpiter e qual é a maior delas?", absent_entities: [], neighbor_domain: false}
